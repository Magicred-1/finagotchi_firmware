# Firmware release workflow (OTA.md §7): tag fw-v* -> build all three envs,
# rename finagotchi-<env>-<version>.bin (version from src/version.h), add the
# extra USB images + per-board ESP Web Tools manifests, SHA-256 everything,
# and create a GitHub Release with an OTA manifest-snippet.json ready to paste
# into the API repo's data/firmware.json.
#
# The snippet's url points at the API's /firmware/files/ route, which relays
# the GitHub asset through the certificate the device trusts. Publishing OTA
# means pasting the snippet into data/firmware.json and redeploying the API.
# See OTA.md §3.

name: firmware release

on:
  push:
    tags: ['fw-v*']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4   # FW_BUILD injects the git short hash

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install platformio

      # src/config.h is gitignored (local Wi-Fi creds): release builds use
      # the credential-free example, so no developer network ever ships in a
      # consumer image and the build doesn't fail on the missing header.
      - name: Use the credential-free config
        run: cp src/config.h.example src/config.h

      - name: Build all envs
        run: pio run -e esp32-s3 -e esp32-s3-sim -e pcb-v1

      - name: Package OTA + USB web-flash binaries and manifests
        env:
          GH_REPO: ${{ github.repository }}
          GH_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/.*FW_VERSION = "\([^"]*\)".*/\1/p' src/version.h)
          echo "Firmware version from src/version.h: $VERSION"
          mkdir -p release
          for ENV in esp32-s3 esp32-s3-sim pcb-v1; do
            cp ".pio/build/$ENV/firmware.bin" "release/finagotchi-$ENV-$VERSION.bin"
          done
          for ENV in esp32-s3 pcb-v1; do
            cp ".pio/build/$ENV/bootloader.bin" "release/finagotchi-$ENV-$VERSION-bootloader.bin"
            cp ".pio/build/$ENV/partitions.bin" "release/finagotchi-$ENV-$VERSION-partitions.bin"
            cp "$HOME/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin" "release/finagotchi-$ENV-$VERSION-boot_app0.bin"
          done
          cd release
          shasum -a 256 *.bin > SHA256SUMS.txt
          python3 ../tools/make_manifest.py "$VERSION" "$GH_REPO" "$GH_TAG" . manifest-snippet.json
          for ENV in esp32-s3 pcb-v1; do
            python3 ../tools/make_web_manifest.py "$VERSION" "$GH_REPO" "$GH_TAG" "$ENV" "web-manifest-$ENV.json"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Firmware ${{ github.ref_name }}
          body: |
            One-time migration: devices still on the `huge_app` partition
            table (any pre-OTA build) cannot OTA themselves into the dual-slot
            layout — the FIRST flash of this build goes over USB. Use
            https://finagotchi.app/firmware or `pio run -e <env> -t upload`.
            Every flash after that is wireless.

            To publish OTA: paste `manifest-snippet.json` into the API repo's
            `data/firmware.json` and redeploy the API. Its /firmware/files/
            route relays these release assets through the certificate the
            device trusts; no binary upload is needed. See OTA.md §3.
            The web flasher reads `web-manifest-<env>.json` directly from
            this release; no website deployment is needed for new versions.
          files: release/*
