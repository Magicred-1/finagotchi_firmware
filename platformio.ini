[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; BLE makes the app bigger than the default 1.3MB partition
board_build.partitions = huge_app.csv
lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
build_flags =
    ; --- TFT_eSPI driver selection ---
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=240
    -D TFT_RGB_ORDER=TFT_BGR
    -D TFT_INVERSION_ON=1

    ; --- Pin wiring (adjust if your board differs) ---
    -D TFT_MOSI=11
    -D TFT_SCLK=12
    -D TFT_CS=10
    -D TFT_DC=9
    -D TFT_RST=14
    -D TFT_BL=13
    -D TFT_MISO=-1
    -D TFT_BACKLIGHT_ON=1

    ; --- ESP32-S3 SPI port selection ---
    -D USE_FSPI_PORT=1

    ; --- SPI / performance ---
    -D SPI_FREQUENCY=27000000
    -D SPI_READ_FREQUENCY=16000000
