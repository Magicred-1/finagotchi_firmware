[platformio]
default_envs = esp32-s3

[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; BLE makes the app bigger than the default 1.3MB partition
board_build.partitions = huge_app.csv
lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    lvgl/lvgl @ ^9.2.0
build_flags =
    ; --- LVGL config: src/lv_conf.h (picked up via LV_CONF_INCLUDE_SIMPLE) ---
    -D LV_CONF_INCLUDE_SIMPLE=1
    -I src

    ; --- TFT_eSPI driver selection ---
    ; GC9A01: the round 240x240 panel (PCB v1 + the Waveshare/PiHut module).
    ; Same SPI pins as the old square ST7789 — only the driver changes.
    ; To fall back to the ST7789: swap GC9A01_DRIVER for ST7789_DRIVER.
    -D USER_SETUP_LOADED=1
    -D GC9A01_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=240
    -D TFT_RGB_ORDER=TFT_BGR
    -D TFT_INVERSION_ON=1

    ; --- Pin wiring (breadboard; the pcb-v1 env carries its own block) ---
    -D TFT_MOSI=11
    -D TFT_SCLK=12
    -D TFT_CS=10
    -D TFT_DC=9
    -D TFT_RST=14
    -D TFT_BL=13
    -D TFT_MISO=-1
    -D TFT_BACKLIGHT_ON=1
    -D TOUCH_CS=-1

    ; --- ESP32-S3 SPI port selection ---
    -D USE_FSPI_PORT=1

    ; Serial (app + crash logs) over the native USB port — required for
    ; debugging on this dev board and on the PCB v1 (native USB only).
    -D ARDUINO_USB_CDC_ON_BOOT=1

    ; --- Fonts (required with USER_SETUP_LOADED, or NO text renders!) ---
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1

    ; --- SPI / performance ---
    ; 40 MHz: the panel handles it comfortably; 27 -> 40 MHz cuts the pet
    ; frame flush (~80 KB sprite canvas) from ~24 ms to ~16 ms.
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=16000000

; Simulator build for the Wokwi project (../finagotchi_wokwi): same firmware
; plus placeholder xStocks DCA plans (SPYX/GOOGLX/HOODX overdue/TSLAX paused)
; so the portfolio cards, + New plan flow and next-buy chip have content
; without BLE. Never flash this to hardware.
[env:esp32-s3-sim]
extends = env:esp32-s3
build_flags =
    ${env:esp32-s3.build_flags}
    -D DCA_DEMO_SEED=1
    -D DCA_FIRST_POLL_MS=5000

; PCB v1 (Finagotchi_V1): ESP32-S3-WROOM-1-N8R2 = 8 MB quad flash + 2 MB quad
; PSRAM (memory_type qio_qspi). Same GC9A01 on the same SPI pins, but the
; backlight is GPIO21 and input moves to the crown encoder (A/B = GPIO15/16,
; push = GPIO4 active-LOW) plus a Cancel button (GPIO7, active-HIGH) — see
; WIRING.md. The flags block is kept fully explicit (not interpolated from
; the breadboard env) so the product target can't drift with breadboard
; experiments. Flash: pio run -e pcb-v1 -t upload
[env:pcb-v1]
extends = env:esp32-s3
board_build.arduino.memory_type = qio_qspi
build_flags =
    ; --- LVGL config: src/lv_conf.h (picked up via LV_CONF_INCLUDE_SIMPLE) ---
    -D LV_CONF_INCLUDE_SIMPLE=1
    -I src

    ; --- TFT_eSPI: GC9A01 round 240x240 panel ---
    -D USER_SETUP_LOADED=1
    -D GC9A01_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=240
    -D TFT_RGB_ORDER=TFT_BGR
    -D TFT_INVERSION_ON=1

    ; --- Pin wiring (PCB v1: same SPI GPIOs, BL = GPIO21) ---
    -D TFT_MOSI=11
    -D TFT_SCLK=12
    -D TFT_CS=10
    -D TFT_DC=9
    -D TFT_RST=14
    -D TFT_BL=21
    -D TFT_MISO=-1
    -D TFT_BACKLIGHT_ON=1
    -D TOUCH_CS=-1

    ; --- ESP32-S3 SPI port selection ---
    -D USE_FSPI_PORT=1

    ; Serial (app + crash logs) over the native USB port — the PCB has no
    ; UART bridge, native USB is the only debug channel.
    -D ARDUINO_USB_CDC_ON_BOOT=1

    ; --- Fonts (required with USER_SETUP_LOADED, or NO text renders!) ---
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1

    ; --- SPI / performance ---
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=16000000

    ; --- PCB v1 input map (crown encoder + cancel) + N8R2 PSRAM ---
    -D FINAGOTCHI_PCB_V1=1
    -D BOARD_HAS_PSRAM=1
