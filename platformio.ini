[platformio]
default_envs = esp32-s3

[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; BLE makes the app bigger than the default 1.3MB partition
board_build.partitions = huge_app.csv
lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
build_flags =
    ; --- TFT_eSPI driver selection ---
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=240
    -D TFT_RGB_ORDER=TFT_BGR
    -D TFT_INVERSION_ON=1

    ; --- Pin wiring (adjust if your board differs) ---
    -D TFT_MOSI=11
    -D TFT_SCLK=12
    -D TFT_CS=10
    -D TFT_DC=9
    -D TFT_RST=14
    -D TFT_BL=13
    -D TFT_MISO=-1
    -D TFT_BACKLIGHT_ON=1
    -D TOUCH_CS=-1

    ; --- ESP32-S3 SPI port selection ---
    -D USE_FSPI_PORT=1

    ; --- Fonts (required with USER_SETUP_LOADED, or NO text renders!) ---
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1

    ; --- SPI / performance ---
    -D SPI_FREQUENCY=27000000
    -D SPI_READ_FREQUENCY=16000000

; Simulator build for the Wokwi project (../finagotchi_wokwi): same firmware
; plus placeholder xStocks DCA plans (SPYX/GOOGLX/MEGAX) so the carousel and
; positions page have content without BLE. Never flash this to hardware.
[env:esp32-s3-sim]
extends = env:esp32-s3
build_flags =
    ${env:esp32-s3.build_flags}
    -D DCA_DEMO_SEED=1
    -D DCA_FIRST_POLL_MS=5000
